name: Common Engine V2 Audio-Free Prototype
on:
  pull_request:
    paths:
      - 'prototype/common-engine-v2-audiofree/**'
      - '.github/workflows/common-engine-v2-audiofree.yml'
  push:
    branches:
      - common-engine-v2-audiofree-integration-20261125
    paths:
      - 'prototype/common-engine-v2-audiofree/**'
      - '.github/workflows/common-engine-v2-audiofree.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run common engine tests and S007 source parity checks
        run: node --test prototype/common-engine-v2-audiofree/runtime.test.cjs prototype/common-engine-v2-audiofree/stories/S007/s007-migration.test.cjs prototype/common-engine-v2-audiofree/stories/legacy-migration.test.cjs
      - name: Reject Story-specific code in common runtime
        run: node prototype/common-engine-v2-audiofree/check-runtime-isolation.cjs
      - name: Rebuild browser bundle
        run: node prototype/common-engine-v2-audiofree/build-browser.cjs
      - name: Check committed bundle is reproducible
        run: git diff --exit-code -- prototype/common-engine-v2-audiofree/quest-v2.browser.js

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python browser testing library (use runner preinstalled Chrome)
        run: python -m pip install playwright==1.56.0
      - name: Test complete synthetic story in real Chromium with mock SpeechRecognition
        run: python prototype/common-engine-v2-audiofree/browser-smoke.py
      - name: Run full real S007 migration in shared browser player with mocked SpeechRecognition
        run: python prototype/common-engine-v2-audiofree/s007-browser-smoke.py
