<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eigo DE Quest — Common Story Player Prototype</title><link rel="stylesheet" href="./play.css"></head>
<body><main><header><h1>Eigo DE Quest — 共通Story Player</h1><p class="warning">独立した検証画面です。Productionではありません。Audio再生はありません。実マイクの利用はブラウザ対応・許可が必要です。</p></header>
<label for="story-select">Story</label><select id="story-select" aria-label="Storyを選択"></select>
<section class="game" aria-label="Storyの画面"><div id="backdrop" role="img" aria-label="Story背景"></div><div id="dialogue" aria-live="polite"><div id="text"></div><div id="support"></div><div id="actions"></div></div></section>
<div id="status" class="status"></div><div class="utility"><button id="restart">最初から</button><button id="resume">保存地点から再開</button></div>
<details><summary>実行記録（検証用）</summary><pre id="log"></pre></details>
</main><script src="./quest-v2.browser.js"></script><script src="./play.js"></script></body></html>
