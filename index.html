  <main id="game" aria-live="polite">
    <section id="scene" class="scene">
      <div id="background" class="background"></div>
      <div id="blue-filter" class="blue-filter" hidden></div>
      <div id="item-layer" class="item-layer"></div>
      <div id="character-layer" class="character-layer"></div>
      <section id="media-layer" class="media-layer" hidden></section>
      <section id="opening-layer" class="opening-layer"></section>
      <section id="pico-break-layer" class="pico-break-layer" hidden>
        <article id="pico-break-card" class="pico-break-card">
          <div class="pico-break-badge">PICO BREAK</div>
          <h2 id="pico-break-title" class="pico-break-title"></h2>
          <p id="pico-break-text" class="pico-break-text"></p>
          <button id="pico-break-close" class="control-button pico-break-close" type="button">冒険にもどる</button>
        </article>
      </section>
      <section id="dialogue-box" class="dialogue-box" hidden>
        <div id="speaker" class="speaker"></div>
        <div id="message" class="message"></div>
        <div id="recognized-text" class="recognized-text" hidden></div>
        <div id="controls" class="controls"></div>
      </section>
    </section>
  </main>
